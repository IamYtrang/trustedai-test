<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Movie Discovery Assistant</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e6;
    --text: #1b1b1f;
    --muted: #6b6b74;
    --accent: #3d5af1;
    --user-bubble: #3d5af1;
    --user-bubble-text: #ffffff;
    --assistant-bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a;
      --panel: #212126;
      --border: #34343a;
      --text: #f0f0f2;
      --muted: #9c9ca6;
      --accent: #7b93ff;
      --user-bubble: #3d5af1;
      --user-bubble-text: #ffffff;
      --assistant-bubble: #2a2a30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  header .controls { display: flex; gap: 10px; align-items: center; margin-left: auto; }
  select, button {
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-bubble-text); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .trace {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    max-width: 100%;
  }
  .trace summary { cursor: pointer; }
  .trace pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; margin: 6px 0 0; }
  #composer {
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }
  #composer input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 600;
  }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 10px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>🎬 Movie Discovery Assistant</h1>
  <div class="controls">
    <label for="user-select" style="font-size:13px; color:var(--muted);">User</label>
    <select id="user-select"></select>
    <input id="custom-user-input" type="number" placeholder="Nhập ID khác" style="width:110px;" />
    <button id="custom-user-go">Use</button>
    <button id="new-chat">New chat</button>
  </div>
</header>
<p class="hint" id="custom-user-error" hidden style="color:#e5484d;"></p>

<div id="chat"></div>
<p class="hint" id="hint">Ask things like "what should I watch tonight?" or "why would I like that?"</p>

<form id="composer">
  <input id="message-input" type="text" placeholder="Ask about movies..." autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
  const chatEl = document.getElementById("chat");
  const userSelect = document.getElementById("user-select");
  const customUserInput = document.getElementById("custom-user-input");
  const customUserGo = document.getElementById("custom-user-go");
  const customUserError = document.getElementById("custom-user-error");
  const newChatBtn = document.getElementById("new-chat");
  const form = document.getElementById("composer");
  const input = document.getElementById("message-input");

  let sessionId = crypto.randomUUID();

  function formatMetrics(metrics) {
    if (!metrics) return "";
    const seconds = (metrics.total_latency_ms / 1000).toFixed(1);
    const tokens = metrics.total_tokens.toLocaleString();
    const inTok = metrics.prompt_tokens.toLocaleString();
    const outTok = metrics.completion_tokens.toLocaleString();
    const cost = metrics.cost_usd == null ? "—" : `$${metrics.cost_usd.toFixed(4)}`;
    return `${seconds}s · ${tokens} tokens (${inTok} in / ${outTok} out) · ${cost}`;
  }

  function addMessage(role, text, toolTrace, metrics) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (toolTrace && toolTrace.length) {
      const details = document.createElement("details");
      details.className = "trace";
      const summary = document.createElement("summary");
      summary.textContent = `Grounded with ${toolTrace.length} tool call(s) — show reasoning`;
      details.appendChild(summary);
      for (const step of toolTrace) {
        const pre = document.createElement("pre");
        const latency = step.latency_ms != null ? ` (${step.latency_ms.toFixed(0)}ms)` : "";
        pre.textContent = `${step.tool}(${JSON.stringify(step.arguments)})${latency}\n=> ${JSON.stringify(step.result, null, 2)}`;
        details.appendChild(pre);
      }
      wrap.appendChild(details);
    }

    if (metrics) {
      const metricsEl = document.createElement("div");
      metricsEl.className = "trace";
      metricsEl.style.borderStyle = "solid";
      metricsEl.textContent = formatMetrics(metrics);
      wrap.appendChild(metricsEl);
    }

    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function loadUsers() {
    const res = await fetch("/api/users");
    const users = await res.json();
    userSelect.innerHTML = "";
    for (const u of users) {
      const opt = document.createElement("option");
      opt.value = u.user_id;
      opt.textContent = `User ${u.user_id} (${u.num_ratings} ratings, avg ${u.avg_rating})`;
      userSelect.appendChild(opt);
    }
  }

  function resetChat() {
    sessionId = crypto.randomUUID();
    chatEl.innerHTML = "";
  }

  async function useCustomUser() {
    const id = customUserInput.value.trim();
    customUserError.hidden = true;
    if (!id) return;

    try {
      const res = await fetch(`/api/users/${id}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        customUserError.textContent = err.detail || `User ${id} not found.`;
        customUserError.hidden = false;
        return;
      }
      const u = await res.json();

      let opt = Array.from(userSelect.options).find((o) => o.value === String(u.user_id));
      if (!opt) {
        opt = document.createElement("option");
        opt.value = u.user_id;
        userSelect.appendChild(opt);
      }
      opt.textContent = `User ${u.user_id} (${u.num_ratings} ratings, avg ${u.avg_rating})`;
      userSelect.value = String(u.user_id);
      customUserInput.value = "";
      resetChat();
    } catch (err) {
      customUserError.textContent = `Request failed: ${err}`;
      customUserError.hidden = false;
    }
  }

  newChatBtn.addEventListener("click", resetChat);
  userSelect.addEventListener("change", resetChat);
  customUserGo.addEventListener("click", useCustomUser);
  customUserInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      useCustomUser();
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);

    const thinking = document.createElement("div");
    thinking.className = "msg assistant";
    thinking.innerHTML = '<div class="bubble">Thinking…</div>';
    chatEl.appendChild(thinking);
    chatEl.scrollTop = chatEl.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          user_id: Number(userSelect.value),
          message: text,
        }),
      });
      thinking.remove();
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        addMessage("assistant", `Error: ${err.detail || res.statusText}`);
        return;
      }
      const data = await res.json();
      addMessage("assistant", data.reply, data.tool_trace, data.metrics);
    } catch (err) {
      thinking.remove();
      addMessage("assistant", `Request failed: ${err}`);
    }
  });

  loadUsers();
</script>
</body>
</html>
